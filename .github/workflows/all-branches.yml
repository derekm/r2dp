name: all-branches-ci

# Builds and tests the TIP of every branch (ci/ci_all_branches.sh): meson
# without DPDK where the tree has a meson.build, a proto.h check where it
# only carries the header, SKIP for meta branches.  Fails only if a
# code-carrying tip fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history of every branch

      - name: Apt deps (meson + C toolchain; no DPDK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config meson ninja-build

      - name: Build + test every branch tip
        run: |
          bash ci/ci_all_branches.sh
