name: all-branches-ci

# Compiles and tests EVERY commit across EVERY branch of the repo — not just
# the default `main` tip.  Meta branches (lineage/agent/usage/site) carry no
# source, so their commits are recorded as SKIP; code-carrying commits are
# meson-built (milestone 0, no DPDK) or proto.h-checked.  Fails only if a
# code-carrying commit fails to build.
#
# This yml is just the keeper/home of the gate — the actual per-commit build
# walks all branches via ci/ci_all_branches.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history of every branch

      - name: Apt deps (meson + C toolchain; no DPDK at milestone 0)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config meson ninja-build

      - name: Build + test every commit on every branch
        run: |
          bash ci/ci_all_branches.sh
