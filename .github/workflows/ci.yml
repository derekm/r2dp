name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config python3-pip
          # clang runner: ensure clang present
          if [ "${{ matrix.compiler }}" = clang ]; then sudo apt-get install -y clang; fi

      - name: Meson setup
        run: |
          CC=${{ matrix.compiler }} meson setup build --buildtype=debugoptimized -Dwerror=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config
      - name: ASan+UBSan build
        run: |
          meson setup build-asan --buildtype=debug \
            -Db_sanitize=address,undefined -Db_lundef=false -Db_staticpic=false
          meson compile -C build-asan
      - name: Test under sanitizers
        run: meson test -C build-asan --print-errorlogs


  # COMMITS C2: the P4/SWX backend, reproducibly from this repo.  First
  # against stock DPDK (reduced features: SAs needing a replay window or
  # NAT-T are refused), then against the pinned DPDK 24.11 + extern series
  # that contrib/upstream/build-dpdk-p4.sh builds (cached on its inputs),
  # where p4_smoke runs the backend.
  p4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libdpdk-dev \
            libssl-dev libnuma-dev python3-pyelftools
      - name: P4 against stock DPDK (-Werror)
        run: |
          meson setup build-p4stock --buildtype=debugoptimized \
            -Denable_dpdk=enabled -Denable_p4=enabled -Dwerror=true
          meson compile -C build-p4stock
          R2DP_REQUIRE_DPDK=1 meson test -C build-p4stock --print-errorlogs
      - name: Cache pinned patched DPDK
        id: dpdkp4
        uses: actions/cache@v4
        with:
          path: ~/dpdk-p4
          key: dpdk-p4-${{ runner.os }}-${{ hashFiles('contrib/upstream/build-dpdk-p4.sh', 'contrib/upstream/*.patch') }}
      - name: Build pinned patched DPDK
        if: steps.dpdkp4.outputs.cache-hit != 'true'
        run: contrib/upstream/build-dpdk-p4.sh ~/dpdk-p4
      - name: P4 against the patched DPDK (-Werror, p4_smoke must run)
        run: |
          PKG_CONFIG_PATH=$HOME/dpdk-p4/lib/pkgconfig meson setup build-p4 \
            --buildtype=debugoptimized -Denable_dpdk=enabled -Denable_p4=enabled -Dwerror=true
          meson compile -C build-p4
          LD_LIBRARY_PATH=$HOME/dpdk-p4/lib R2DP_REQUIRE_DPDK=1 \
            meson test -C build-p4 --print-errorlogs
          LD_LIBRARY_PATH=$HOME/dpdk-p4/lib R2DP_REQUIRE_DPDK=1 \
            meson test -C build-p4 p4_smoke -v | tee p4_smoke.log
          ! grep -q SKIP p4_smoke.log

  # D11: the data plane (fwd/dp_dpdk.c, dp_gcm.c) and its known-answer test are
  # only compiled when DPDK is enabled, so the control-only builds above leave
  # the whole forwarding path CI-invisible.  This lane builds with libdpdk-dev
  # and runs gcm_kat with R2DP_REQUIRE_DPDK=1 so a broken data plane is a hard
  # failure, never a pass-as-SKIP.
  dpdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DPDK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libdpdk-dev libssl-dev
      - name: Build data plane (DPDK enabled)
        run: |
          meson setup build-dpdk --buildtype=debugoptimized -Denable_dpdk=enabled -Dwerror=true
          meson compile -C build-dpdk
      - name: Test (gcm_kat must not skip)
        run: |
          R2DP_REQUIRE_DPDK=1 meson test -C build-dpdk --print-errorlogs
      - name: Data-path benchmark regression (64/512/1400B, 1/65/201 tunnels)
        run: |
          # relative gate: per size, 201-tunnel cost <= 1.5x 1-tunnel cost;
          # plus a loose 8000 cyc/pkt sanity bound at 64B
          R2DP_REQUIRE_DPDK=1 meson test -C build-dpdk --benchmark --print-errorlogs -v
          for pmd in openssl auto; do
            build-dpdk/bench/fwd_bench --pmd $pmd --json bench-$pmd.json
          done
          build-dpdk/bench/fwd_bench --workers 2 --json bench-workers2.json
      - name: Benchmark entry point smoke (bench/run.sh --quick)
        run: |
          BUILD=build-dpdk OUT=bench-smoke bench/run.sh --quick --no-build
          test -s bench-smoke/summary.csv && test -s bench-smoke/env.json
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: fwd-bench
          path: |
            bench-*.json
            bench-smoke/
      - name: ASan+UBSan data plane
        run: |
          meson setup build-dpkasan --buildtype=debug -Denable_dpdk=enabled \
            -Db_sanitize=address,undefined -Db_lundef=false -Db_staticpic=false
          meson compile -C build-dpkasan
          R2DP_REQUIRE_DPDK=1 meson test -C build-dpkasan --print-errorlogs

  # Data-plane interop: r2dp-fwd (DPDK net_tap + crypto_openssl) against an
  # independent scapy ESP peer, in a throwaway user+net+mount namespace
  # (no root, no ip netns).  Every phase must pass and every packet must
  # land on its exact counter (tests/e2e/fwd_e2e.sh).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [dpdk, kernel]
        workers: [1]
        include:
          - { backend: dpdk, workers: 2 }
          - { backend: dpdk, workers: 3 }
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libdpdk-dev libssl-dev iproute2 python3-venv
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # kernel lane: ESP + netlink XFRM (modules are not autoloaded from a userns)
          sudo modprobe -a esp4 xfrm_user xfrm4_tunnel tunnel4 ip_tunnel || true
      - name: Python venv (scapy + cryptography)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q scapy cryptography
      - name: Build (DPDK, ASan+UBSan)
        run: |
          meson setup build-e2e --buildtype=debug -Denable_dpdk=enabled \
            -Db_sanitize=address,undefined -Db_lundef=false
          meson compile -C build-e2e
      - name: kfwd_test (kernel backend through the r2dp socket)
        if: matrix.backend == 'kernel'
        run: R2DP_REQUIRE_KERNEL=1 meson test -C build-e2e kfwd_test --print-errorlogs
      - name: fwd_e2e (unshare -Urnm, ${{ matrix.backend }}, ${{ matrix.workers }} worker(s))
        run: |
          unshare -Urnm --propagation private bash -c '
            mount -t tmpfs none /run &&
            BACKEND=${{ matrix.backend }} FWD_WORKERS=${{ matrix.workers }} \
            PYTHON="$RUNNER_TEMP/venv/bin/python" R2DP_E2E_DIR="$RUNNER_TEMP/e2e" \
              tests/e2e/fwd_e2e.sh build-e2e/fwd/r2dp-fwd build-e2e/r2dpctl'
      - name: Forwarder log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/e2e/fwd.out" || true

  # Multi-thread data-plane tests under ThreadSanitizer.  DPDK itself is
  # not instrumented; tests/tsan.supp hides races whose stack includes
  # librte_*.  A green job is not proof the data path is race-free.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DPDK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config libdpdk-dev libssl-dev clang
      - name: TSan build
        run: |
          CC=clang meson setup build-tsan --buildtype=debug -Denable_dpdk=enabled \
            -Db_sanitize=thread -Db_lundef=false -Dc_args=-DRTE_FORCE_INTRINSICS
          meson compile -C build-tsan
      - name: Multi-thread tests under TSan
        run: |
          TSAN_OPTIONS="suppressions=$PWD/tests/tsan.supp halt_on_error=1" \
            meson test -C build-tsan --print-errorlogs \
            dp_mt dp_sa dp_grow nh_tab
